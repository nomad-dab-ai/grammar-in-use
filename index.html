<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar in Use Practice</title>
  <meta name="description" content="Grammar in Use 문장으로 쉐도잉·영어 떠올리기를 반복 연습하는 학습장">
  <meta name="theme-color" content="#5B4FE8">
  <meta property="og:title" content="Grammar in Use 연습장">
  <meta property="og:description" content="쉐도잉·영어 떠올리기 반복 학습">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>Grammar in Use</h1>
  <p class="subtitle">반복 학습 연습장</p>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="audio">
    <span class="tab-icon">🎵</span>
    <span>쉐도잉 연습</span>
  </button>
  <button class="tab-btn" data-tab="recall">
    <span class="tab-icon">💭</span>
    <span>영어 떠올리기</span>
  </button>
  <button class="tab-btn" data-tab="variant">
    <span class="tab-icon">🔁</span>
    <span>바꿔 말하기</span>
  </button>
</nav>

<main class="app-main">

  <!-- ───── TAB 1 : 음원 듣기 ───── -->
  <section id="tab-audio" class="tab-section active">

    <div class="filter-bar">
      <div class="grammar-selector">
        <button class="grammar-sel-btn" id="audio-grammar-btn">전체 문법 ▾</button>
        <div class="grammar-panel" id="audio-grammar-panel">
          <label class="grammar-item grammar-all">
            <input type="checkbox" id="audio-chk-all">
            <span>전체 선택</span>
          </label>
          <div id="audio-grammar-list"></div>
        </div>
      </div>
      <label class="shuffle-toggle">
        <input type="checkbox" id="audio-shuffle">
        <span>🔀 랜덤</span>
      </label>
      <label class="shuffle-toggle review-toggle">
        <input type="checkbox" id="audio-review-only">
        <span>★ 다시 볼 문장만 (<span class="review-count">0</span>)</span>
      </label>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-text">
        <span id="audio-curr">0</span> / <span id="audio-total">0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="audio-fill"></div>
      </div>
    </div>

    <div class="card audio-card">
      <div class="category-badge" id="audio-badge">—</div>
      <button class="btn-star" id="audio-star" aria-pressed="false" title="다시 볼 문장으로 표시">☆</button>

      <div class="audio-play-row">
        <button class="btn-listen" id="btn-listen" disabled>▶ 문장 듣기</button>
        <button class="btn-speed" id="btn-speed" title="재생 속도">1×</button>
        <button class="btn-repeat" id="btn-repeat" title="반복 재생 꺼짐" aria-pressed="false">🔁</button>
        <div class="audio-status" id="audio-status"></div>
      </div>

      <audio id="audio-player"></audio>

      <button class="btn-reveal" id="btn-audio-reveal">정답 보기</button>

      <div class="english-reveal" id="audio-reveal">
        <div class="korean-text" id="audio-korean"></div>
        <div class="english-text" id="audio-english"></div>
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn-nav" id="btn-audio-prev">◀ 이전</button>
      <button class="btn-nav btn-primary" id="btn-audio-next">다음 ▶</button>
    </div>

    <div class="complete-banner" id="audio-complete">
      🎉 모든 문장을 완료했어요!
      <button class="btn-restart" id="btn-audio-restart">처음부터 다시</button>
    </div>

  </section>


  <!-- ───── TAB 2 : 영어 떠올리기 ───── -->
  <section id="tab-recall" class="tab-section">

    <div class="filter-bar">
      <div class="grammar-selector">
        <button class="grammar-sel-btn" id="recall-grammar-btn">전체 문법 ▾</button>
        <div class="grammar-panel" id="recall-grammar-panel">
          <label class="grammar-item grammar-all">
            <input type="checkbox" id="recall-chk-all">
            <span>전체 선택</span>
          </label>
          <div id="recall-grammar-list"></div>
        </div>
      </div>
      <label class="shuffle-toggle">
        <input type="checkbox" id="recall-shuffle">
        <span>🔀 랜덤</span>
      </label>
      <label class="shuffle-toggle review-toggle">
        <input type="checkbox" id="recall-review-only">
        <span>★ 다시 볼 문장만 (<span class="review-count">0</span>)</span>
      </label>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-text">
        <span id="recall-curr">0</span> / <span id="recall-total">0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="recall-fill"></div>
      </div>
    </div>

    <div class="card recall-card">
      <div class="category-badge" id="recall-badge">—</div>
      <button class="btn-star" id="recall-star" aria-pressed="false" title="다시 볼 문장으로 표시">☆</button>
      <div class="korean-text" id="recall-korean">로딩 중…</div>

      <button class="btn-reveal" id="btn-reveal">정답 보기</button>

      <div class="english-reveal" id="recall-reveal">
        <div class="english-text" id="recall-english"></div>
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn-nav" id="btn-recall-prev">◀ 이전</button>
      <button class="btn-nav btn-primary" id="btn-recall-next">다음 ▶</button>
    </div>

    <div class="complete-banner" id="recall-complete">
      🎉 모든 문장을 완료했어요!
      <button class="btn-restart" id="btn-recall-restart">처음부터 다시</button>
    </div>

  </section>


  <!-- ───── TAB 3 : 바꿔 말하기 (변형 연습) ───── -->
  <section id="tab-variant" class="tab-section">

    <div class="filter-bar">
      <div class="grammar-selector">
        <button class="grammar-sel-btn" id="variant-grammar-btn">전체 문법 ▾</button>
        <div class="grammar-panel" id="variant-grammar-panel">
          <label class="grammar-item grammar-all">
            <input type="checkbox" id="variant-chk-all">
            <span>전체 선택</span>
          </label>
          <div id="variant-grammar-list"></div>
        </div>
      </div>
      <label class="shuffle-toggle">
        <input type="checkbox" id="variant-shuffle">
        <span>🔀 랜덤</span>
      </label>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-text">
        <span id="variant-curr">0</span> / <span id="variant-total">0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="variant-fill"></div>
      </div>
    </div>

    <div class="card variant-card">
      <div class="category-badge" id="variant-badge">—</div>

      <!-- 처음엔 문제(변형 한국어 뜻)만. 원문은 정답과 함께 공개된다. -->
      <div class="variant-task">
        <div class="variant-task-label">이 문장을 영어로 말해보세요</div>
        <div class="korean-text" id="variant-korean">로딩 중…</div>
      </div>

      <button class="btn-reveal" id="btn-variant-reveal">정답 보기</button>

      <div class="english-reveal" id="variant-reveal">
        <!-- 원문과 나란히 보여 무엇이 바뀌었는지 비교된다 -->
        <div class="variant-original">
          <div class="variant-original-label">원문</div>
          <div class="english-text" id="variant-orig-english"></div>
          <div class="korean-text" id="variant-orig-korean"></div>
        </div>
        <div class="variant-answer-label">변형 정답</div>
        <div class="english-text" id="variant-english"></div>
      </div>
    </div>

    <div class="nav-buttons">
      <button class="btn-nav" id="btn-variant-prev">◀ 이전</button>
      <button class="btn-nav btn-primary" id="btn-variant-next">다음 ▶</button>
    </div>

    <div class="complete-banner" id="variant-complete">
      🎉 모든 변형을 완료했어요!
      <button class="btn-restart" id="btn-variant-restart">처음부터 다시</button>
    </div>

  </section>


</main>

<script src="app.js"></script>
<script src="lesson-mode.js"></script>
</body>
</html>
